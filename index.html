<!DOCTYPE html>
<html lang="es-VE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tasas Venezuela · Dólar BCV y P2P en vivo</title>
  <meta name="description" content="Calculadora y tasas de cambio del dólar en Venezuela (BCV y Binance P2P) en vivo. PWA instalable." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#181818" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tasas VE" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />

  <!-- Tipografía única global: Space Grotesk (500/600/700) para texto Y cifras -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Motion (motor de Framer Motion, build UMD) — anima el splash 'despegue de cohete' -->
  <script defer src="https://cdn.jsdelivr.net/npm/motion@11.13.5/dist/motion.js"
    onload="document.dispatchEvent(new CustomEvent('motion:ready'))"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // Space Grotesk: fuente ÚNICA global (texto + cifras), trazo geométrico
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            num: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          },
          letterSpacing: {
            // Números compactos y estables (spec: -0.02em)
            tight: '-0.02em',
          },
        },
      },
    };
  </script>

  <style>
    /* Input numérico limpio, sin controles nativos */
    input[type='number']::-webkit-outer-spin-button,
    input[type='number']::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type='number'] { -moz-appearance: textfield; appearance: textfield; }

    /* Foco accesible coherente con el acento Volt */
    :focus-visible { outline: 2px solid #F0FF00; outline-offset: 2px; }
    /* Selección de texto en toda la app: Volt sobre carbón */
    ::selection { background: #F0FF00; color: #181818; }
    /* Badge brutalista de estado/tasa bajo la calculadora: bloque sólido Volt
       con texto carbón, esquinas micro-redondeadas (contrasta con las curvas
       del Liquid Glass) y cifras tabulares de Space Grotesk. */
    .result-badge {
      display: inline-flex; align-items: center; justify-content: center;
      margin: 16px auto 0;
      padding: 4px 12px;
      border-radius: 4px;
      background-color: #F0FF00;
      color: #181818;
      font-size: 12px; font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }

    /* ===== Fondo vivo: esferas Lima Ácido sobre gris carbón =====
     * Anti color-banding SIN blur: la suavidad vive en el gradiente con
     * interpolación oklch (6 paradas que funden la luz hacia #181818, sin
     * pasar por transparent). Se anima SOLO transform — nunca opacity/filter. */
    @keyframes floatOrbs {
      from { transform: translate3d(35vw, 30vh, 0) scale(1.2); }
      to   { transform: translate3d(-35vw, -30vh, 0) scale(.85); }
    }
    .orb {
      width: 85vw; height: 85vw;
      min-width: 680px; min-height: 680px;
      border-radius: 50%;
      background: radial-gradient(
        circle at center in oklch,
        rgba(240, 255, 0, 0.22) 0%,
        rgba(205, 218, 8, 0.16) 18%,
        rgba(155, 165, 14, 0.11) 35%,
        rgba(100, 106, 18, 0.06) 52%,
        rgba(55, 58, 21, 0.025) 68%,
        rgba(24, 24, 24, 0) 85%
      );
      transform: translateZ(0);
      will-change: transform;
      backface-visibility: hidden;
      animation: floatOrbs 4.5s ease-in-out infinite alternate;
    }
    /* Esfera B: toque cálido #D4FF00 con la MISMA curva anti-banding */
    .orb.orb-b {
      background: radial-gradient(
        circle at center in oklch,
        rgba(212, 255, 0, 0.22) 0%,
        rgba(200, 218, 8, 0.16) 18%,
        rgba(150, 165, 14, 0.11) 35%,
        rgba(97, 106, 18, 0.06) 52%,
        rgba(54, 58, 21, 0.025) 68%,
        rgba(24, 24, 24, 0) 85%
      );
      animation-duration: 5.5s; animation-delay: -2.2s;
      animation-direction: alternate-reverse; /* recorrido opuesto al de A */
    }
    .orb.orb-c { animation-duration: 6s; animation-delay: -3s; }
    /* Esferas Púrpura (D y E): MISMA curva anti-banding en oklch, sin blur.
       Se intercalan con las Lima para crear la atmósfera bicolor. */
    .orb.orb-d, .orb.orb-e {
      background: radial-gradient(
        circle at center in oklch,
        rgba(128, 70, 195, 0.25) 0%,
        rgba(108, 58, 168, 0.18) 20%,
        rgba(82, 44, 128, 0.11) 38%,
        rgba(56, 33, 84, 0.06) 55%,
        rgba(36, 26, 48, 0.025) 70%,
        rgba(24, 24, 24, 0) 85%
      );
    }
    .orb.orb-d { animation-duration: 5s;   animation-delay: -0.8s; animation-direction: alternate-reverse; }
    .orb.orb-e { animation-duration: 4.8s; animation-delay: -3.7s; }

      background-repeat: repeat;
      background-size: 128px 128px;
      opacity: .045;
    }
    /* Móvil: 95vw (bañan la pantalla) y coreografía intercalando Lima/Púrpura */
    @media (max-width: 768px) {
      .orb { width: 95vw; height: 95vw; min-width: 0; min-height: 0; }
      .orb.orb-a { top: 15%;    left: -12%; }
      .orb.orb-b { bottom: 20%; right: -14%; }
      .orb.orb-c { bottom: 32%; left: 16%; }
      .orb.orb-d { top: 4%;     left: 38%; }
      .orb.orb-e { bottom: 2%;  right: 2%; }
    }

    /* ===== Aparición escalonada: fade-in-up ===== */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* fill: backwards (NO both) — oculta el elemento durante el delay (anti-FOUC)
       pero NO deja transform/opacity residual tras el fade-in. Un transform
       residual convertiría al ancestro en backdrop-root (Chromium) y AISLARÍA
       el backdrop-filter de las tarjetas: dejarían de difuminar el grano del
       fondo y se verían granulosas. Con backwards, al terminar la animación
       el elemento vuelve a su estilo base (sin transform, sin stacking context). */
    .fade-up { animation: fade-in-up .65s cubic-bezier(.21,1.02,.73,1) backwards; }

    body {
      touch-action: manipulation;
    }

    /* ═════════════════════════════════════════════════════════════
     * iOS LIQUID GLASS — clase reutilizable (HIG / iOS 26)
     * Bisel interno 3D + borde de refracción + blur saturado.
     * ═══════════════════════════════════════════════════════════ */
    .ios-liquid-glass {
      background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 50%, rgba(255,255,255,.04) 100%);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow:
        0 12px 32px -4px rgba(0, 0, 0, .5),
        inset 0 1.5px 1px 0 rgba(255, 255, 255, .35),
        inset 1px 0 1px 0 rgba(255, 255, 255, .15),
        inset 0 -1px 2px 0 rgba(255, 255, 255, .10);
    }
    /* Variante botones: cristal neutro ahumado, borde sutil (se enciende en
       Volt solo al interactuar) */
    .ios-glass-btn {
      border-color: rgba(255, 255, 255, .12);
      background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 50%, rgba(255,255,255,.05) 100%);
    }
    /* Botón ↑↓: corte 100% opaco sobre el seam (sin cristal translúcido).
       Fondo sólido + anillo del color exacto de la página: las líneas de las
       tarjetas jamás se ven atravesando el círculo. Cero glow verde. */
    .swap-btn {
      background-color: #1E1E1E;
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 0 0 4px #181818;
    }
    /* Pastilla de ícono: 38×38, radio 12, íconos 18×18 centrados geométricamente */
    .ios-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 12px;
      color: rgba(255, 255, 255, .7);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all .2s ease;
    }
    .ios-icon-btn:hover { color: #F0FF00; border-color: rgba(240, 255, 0, .55); background-color: rgba(240, 255, 0, .07); }
    .ios-icon-btn:active { transform: scale(.94); color: #F0FF00; border-color: #F0FF00; }
    .ios-icon-btn:focus-visible { outline: 2px solid #F0FF00; outline-offset: 2px; }
    .ios-icon-btn[data-copied] { color: #F0FF00; }

    /* Las tarjetas del conversor NO llevan estilo propio: comparten EXACTAMENTE
       la clase .ios-liquid-glass del módulo superior (mismo background, mismo
       backdrop-filter, mismo borde y radio). El acabado liso de las tres
       superficies lo garantiza además el fill 'backwards' de .fade-up (sin
       transform residual que aísle el backdrop-filter — ver comentario arriba). */

    /* Luz ambiental difusa: el cristal necesita luz real que refractar */
    .glass-ambient { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .glass-orb {
      position: absolute; z-index: 0; pointer-events: none; border-radius: 9999px;
      background: radial-gradient(circle, rgba(240, 255, 0, .16) 0%, transparent 70%);
      filter: blur(60px);
    }
    .glass-orb-a { width: 190px; height: 190px; top: -10px; left: 10px; }
    .glass-orb-b { width: 210px; height: 210px; bottom: 90px; right: 10px; }

    /* ===== MÓDULO DE COTIZACIONES: contenedor horizontal Liquid Glass =====
     * 1 cristal · grid estricto de 3 columnas iguales · divisores de 1px
     * entre columnas · columnas seleccionables sin sub-tarjetas. */
    .rates-glass {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));   /* 3 iguales, sin colapso de ancho */
      position: relative;                                 /* se apila sobre la luz ambiental */
      overflow: hidden;
      width: 100%;
      padding: 22px 8px;                                  /* aire vertical: la luz del chip activo respira hasta opacidad 0 */
      border-radius: 20px;
    }
    /* Divisores verticales sutiles: solo en las dos primeras columnas */
    .rates-glass > .rate-col:not(:last-child) { border-right: 1px solid rgba(255, 255, 255, .07); }

    /* Columna: 3 niveles centrados sobre el mismo eje, sin sub-tarjetas */
    .rate-col {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;                                           /* aire uniforme sigla → nombre → monto */
      min-width: 0; padding: 10px 6px;
      white-space: nowrap;                                /* prohibido salto de línea en cualquier texto */
      text-align: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      opacity: .5;                                        /* inactivas: atenuadas */
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
    }
    .rate-col:hover { opacity: .8; }
    .rate-col:active { transform: scale(.98); }
    .rate-col:focus-visible { outline: 2px solid #F0FF00; outline-offset: -2px; border-radius: 12px; }
    /* Monto: Space Grotesk 700, tabular y compacto (16px; baja a 14px solo en móviles estrechos) */
    .rate-col .rate-price {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }
    /* Prefijo monetario "Bs.": jerarquía secundaria (12px / 500 / 55%) */
    .rate-cur { font-size: .75rem; font-weight: 500; color: rgba(255, 255, 255, .55); margin-right: .25rem; }

    /* Placeholder del resultado: espejo EXACTO del placeholder del input superior
       (mismo gris semitransparente, mismo tamaño heredado de la cifra grande) */
    .result-ph { color: rgba(255, 255, 255, .2); }

    /* Estado activo minimalista: halo radial + píldora luminosa, sin cajas con borde */
    .rate-col::after {
      content: '';
      position: absolute; left: 50%; bottom: 1px;
      width: 16px; height: 2px; border-radius: 2px;
      transform: translateX(-50%);
      background: #F0FF00;
      box-shadow: 0 0 8px #F0FF00;
      opacity: 0; transition: opacity .25s ease;
    }
    .rate-col.rate-selected,
    .rate-col.rate-selected:hover {
      opacity: 1;
      /* Destello sin clipping: 'ellipse closest-side' termina en opacidad 0 EXACTAMENTE
         en los 4 bordes del chip → la luz se desvanece por completo antes del borde
         físico del cristal y de los divisores (nunca se corta arriba/abajo). */
      background: radial-gradient(ellipse closest-side at center, rgba(240, 255, 0, .15) 0%, rgba(240, 255, 0, .075) 38%, rgba(240, 255, 0, .028) 66%, transparent 100%);
    }
    .rate-col.rate-selected .rate-sigla { color: #F0FF00; font-weight: 600; letter-spacing: .05em; }
    .rate-col.rate-selected::after { opacity: 1; }

    /* ===== Auto-ajuste del monto resultante: el número nunca desborda el glass ===== */
    #result { white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .orb, .fade-up { animation: none; }
      #app-footer { animation: none; opacity: 1; }
      * { transition-duration: 0.01ms !important; }
      /* Sin preferencia de movimiento: sin splash animado */
      #splash { display: none !important; }
    }

    /* ===== Splash inmersivo (Dark Liquid Glass) ===== */
    /* Estado inicial pre-animación (anti-FOUC): fuera de pantalla, escala .6, giro en Z.
       Nota: spring + keyframes en UNA animación requieren la misma lista de funciones
       de transform (convención de planos) → translateY + rotate + scale en todo el vuelo. */
    #splash-card-wrap {
      transform: translateY(100vh) rotate(4deg) scale(.6);
      opacity: 0;
    }
    /* Micro-movimiento orgánico: balanceo sutil en Z mientras asciende (via CSS, compone con el spring) */
    #splash-card { animation: splash-lean 2.6s ease-in-out; }
    @keyframes splash-lean {
      0%   { transform: rotate(0deg); }
      30%  { transform: rotate(-2.4deg); }
      62%  { transform: rotate(1.6deg); }
      85%  { transform: rotate(-0.7deg); }
      100% { transform: rotate(0deg); }
    }
    /* Anillo de gradiente giratorio: Lima Ácido en bucle (ajusta 2.8s para la velocidad) */
    #splash-ring {
      background: conic-gradient(from var(--ring-angle, 0deg), #F0FF00, #D4FF00, rgba(240, 255, 0, .25), #F0FF00);
      animation: splash-spin 2.8s linear infinite;
    }
    @keyframes splash-spin { to { --ring-angle: 360deg; } }
    @property --ring-angle {
      syntax: '<angle>'; initial-value: 0deg; inherits: false;
    }
    /* Barra láser: pulso que barre dentro de su carril ultradelgado */
    #splash-beam { animation: beam-sweep 1.4s ease-in-out infinite; }
    @keyframes beam-sweep {
      0%   { transform: translateX(-120%); opacity: .4; }
      50%  { transform: translateX(320%); opacity: 1; }
    }

    /* Footer: permanece invisible 2.5s (no choca con el splash) y hace fade-in suave de 1.5s */
    #app-footer { animation: footer-in 1.5s ease-out 2.5s forwards; }
    @keyframes footer-in { to { opacity: 1; } }
  </style>
</head>

<body class="min-h-dvh bg-[#181818] font-sans text-white antialiased touch-manipulation">

  <!-- ==================== Lógica (Vanilla JS) ==================== -->
  <script>
  /* ════════════════════════════════════════════════════════════════
   * ✨ SPLASH DE BIENVENIDA (identidad blanca) — Motion (mismo motor de Framer Motion)
   * Secuencia: despegue fluido del logo (spring) → estela esmeralda →
   * disolvencia del lienzo blanco hacia la app "Dark Liquid Glass". Solo se reproduce en la
   * primera visita de la sesión; con prefers-reduced-motion o sin motor
   * (CDN caído / offline) la app se libera sin bloquearse jamás.
   * ════════════════════════════════════════════════════════════════ */
  (() => {
    'use strict';

    const splash = document.getElementById('splash');
    if (!splash) return;

    // ?splash-debug=1 → fuerza la reproducción (ignora el candado de sesión) y
    // conserva el splash al final, marcado, para inspección del estado final.
    const DEBUG = new URLSearchParams(location.search).has('splash-debug');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || (sessionStorage.getItem('tasasve:splash') && !DEBUG)) {
      splash.remove();
      return;
    }
    try { sessionStorage.setItem('tasasve:splash', '1'); } catch (_) {}

    splash.hidden = false;

    // Título en spans individuales: habilita el blur-in letra por letra (stagger 55ms)
    const titleEl = document.getElementById('splash-title');
    if (titleEl && !titleEl.children.length) {
      'CambioVE'.split('').forEach((ch) => {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.cssText = 'display:inline-block;opacity:0;will-change:transform,filter;';
        titleEl.appendChild(s);
      });
    }

    let launched = false;
    const finish = () => {
      if (window.__splashFXStop) window.__splashFXStop();   // apaga el canvas de partículas
      if (DEBUG) { splash.dataset.splashFinished = '1'; splash.style.pointerEvents = 'none'; }
      else splash.remove();
      document.dispatchEvent(new CustomEvent('splash:done'));
    };
    const skip = () => { if (!launched) { launched = true; finish(); } };

    const hasEngine = () => window.Motion && typeof window.Motion.animate === 'function';

    if (!hasEngine()) {
      // El motor está en defer: esperar su evento; si nunca llega (offline), liberar.
      document.addEventListener('motion:ready', () => boot(), { once: true });
      addEventListener('load', () => setTimeout(() => { if (!hasEngine()) skip(); }, 1200));
      return;
    }
    boot();

    /* ── Motor de partículas (canvas): orbes esmeralda/menta que ascienden en espiral
     *    detrás del logo, con parpadeo y tamaño variables.
     *    Ajustes rápidos: COLORS (tonos), COUNT (densidad), vy (velocidad), drift (espiral). */
    function bootFX() {
      const canvas = document.getElementById('splash-particles');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const COLORS = ['#F0FF00', '#D4FF00', '#EAFF00', '#CCFF33'];   // gama Lima Ácido / Volt
      let W = 0, H = 0;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const COUNT = Math.min(42, Math.max(16, Math.round(W / 22)));
      const parts = Array.from({ length: COUNT }, () => ({
        x: W * (0.5 + (Math.random() - 0.5) * 0.9),
        y: H + Math.random() * H * 0.6,
        r: 1.2 + Math.random() * 3.2,        // radio del orbe
        vy: 26 + Math.random() * 70,         // velocidad de ascenso (px/s)
        drift: 14 + Math.random() * 46,      // amplitud de la espiral (px)
        phase: Math.random() * Math.PI * 2,
        spin: 0.6 + Math.random() * 1.8,     // giro de la espiral (rad/s)
        alpha: 0.25 + Math.random() * 0.55,
        color: COLORS[(Math.random() * COLORS.length) | 0],
      }));
      let last = performance.now(), alive = true;
      const tick = (now) => {
        if (!alive) return;
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        ctx.clearRect(0, 0, W, H);
        for (const p of parts) {
          p.y -= p.vy * dt;
          p.phase += p.spin * dt;
          if (p.y < -12) { p.y = H + 10; p.x = W * (0.5 + (Math.random() - 0.5) * 0.9); }
          const x = p.x + Math.sin(p.phase) * p.drift;       // componente espiral
          const tw = 0.6 + 0.4 * Math.sin(p.phase * 2.1);    // parpadeo (twinkle)
          ctx.globalAlpha = p.alpha * tw;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color; ctx.shadowBlur = 10;    // halo de luz
          ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      window.__splashFXStop = () => { alive = false; };
    }

    function boot() {
      if (launched) return;
      launched = true;

      const { animate } = window.Motion;
      const $ = (id) => document.getElementById(id);
      const cardWrap = $('splash-card-wrap');
      const ring = $('splash-ring');
      const veil = $('splash-veil');
      const glow = $('splash-glow');
      const copy = $('splash-copy');

      // Normaliza: Motion One expone .finished; las controls de Framer son thenables.
      const whenDone = (ctrl) => (ctrl && ctrl.finished ? ctrl.finished : ctrl);

      let done = false;
      const finishOnce = () => { if (!done) { done = true; finish(); } };
      const safety = setTimeout(finishOnce, 8000);         // red de seguridad absoluta (máquinas lentas)

      try {
        // ── FX: partículas + anillo gradiente (ver #particulas y @keyframes splash-spin) ──
        bootFX();

        // ── 1) HERO MOTION: spring orgánico pesado (stiffness 75 / damping 14 / mass 1.1) ──
        //     Inercia al arrancar, aceleración fluida y frenado suave (ζ≈0.77).
        //     Convención de planos 2D (translateY + rotate + scale) = al CSS anti-FOUC;
        //     el balanceo orgánico en Z lo aporta .splash-lean en el elemento hijo.
        const liftoff = animate(cardWrap, {
          transform: 'translateY(0vh) rotate(0deg) scale(1)',
          type: 'spring',
          stiffness: 75,
          damping: 14,
          mass: 1.1,
        });
        animate(cardWrap, { opacity: [0, 1], duration: 0.4, ease: 'ease-out' });

        // Aura/estela de energía que acompaña el ascenso del logo
        animate(glow, { opacity: [0, 1, 0.75], scale: [0.5, 1.1, 1.25], duration: 1.9, ease: 'ease-out' });

        whenDone(liftoff).then(() => {
          if (done) return;
          cardWrap.style.transform = 'translateY(0vh) rotate(0deg) scale(1)';

          // ── 2) BREATHING: levitación continua de la tarjeta + anillo vivo ──
          animate(cardWrap, { y: [-4, 4, -4], duration: 3.2, repeat: Infinity, ease: 'ease-in-out' });
          animate(ring, { opacity: [0, 0.9], duration: 0.6 });
          animate(glow, { opacity: [0.75, 0.5, 0.75], duration: 3.2, repeat: Infinity, ease: 'ease-in-out' });

          // ── 3) TYPOGRAPHY BLUR-IN: letra por letra con desenfoque progresivo ──
          const title = $('splash-title');
          const letras = title.textContent ? Array.from(title.children) : [];
          letras.forEach((el, i) => {
            animate(el, {
              opacity: [0, 1],
              filter: ['blur(10px)', 'blur(0px)'],
              y: [8, 0],
              delay: i * 0.055,
              duration: 0.5,
              ease: [0.22, 1, 0.36, 1],
            });
          });
          animate(copy, { opacity: [0, 1], y: [14, 0], duration: 0.5, ease: [0.22, 1, 0.36, 1] });

          // ── 4) SALIDA LIMPIA: disolvencia cinematográfica de TODO el velo (sin círculos) ──
          //     Fade general + micro zoom, revelando al instante la app ya cargada debajo.
          setTimeout(() => {
            if (done) return;
            animate(copy, { opacity: 0, y: -12, filter: 'blur(6px)', duration: 0.4, ease: 'ease-in' });
            animate(cardWrap, {
              transform: 'translateY(0vh) rotate(0deg) scale(1.08)',
              opacity: 0,
              duration: 0.6,
              delay: 0.1,
              ease: [0.32, 0, 0.67, 0],
            });
            whenDone(animate(veil, {
              opacity: 0,
              scale: 1.03,
              duration: 0.8,
              ease: 'ease-in-out',
            })).then(finishOnce).catch(finishOnce);
          }, 1150);   // hold de bienvenida tras el aterrizaje (ajustable)
        }).catch(finishOnce);
      } catch (err) {
        console.error('[splash] secuencia interrumpida; liberando la app:', err);
        finishOnce();
      }
    }
  })();

  (() => {
    'use strict';

    /* ══════════════════════════════════════════════════════════════
     * ⚙️ CONFIGURACIÓN DE LA API — EDITA AQUÍ
     * --------------------------------------------------------------
    * PROXY_URL → Proxy serverless de Netlify o proxy local de server.js.
     * ══════════════════════════════════════════════════════════════ */
    /* ══════════════════════════════════════════════════════════════
     * ⚙️ CONFIGURACIÓN DE FUENTES — EDITA AQUÍ
     * --------------------------------------------------------------
     * 1-2) Proxies con API key (Netlify en prod, server.js en local):
     *      entregan el payload completo (USD, EUR y P2P) en una llamada.
     * 3-4) Puentes públicos de solo lectura (sin key), consultados en
     *      paralelo: bcv.org.ve (USD + EUR oficiales, fuente primaria)
     *      y cotizave.com (Binance P2P, el BCV no publica P2P).
     * ══════════════════════════════════════════════════════════════ */
    const PROXY_SOURCES = [
      { label: 'proxy-netlify', url: '/.netlify/functions/rates' },
      { label: 'proxy-local', url: './api/rates' },
    ];
    const BRIDGE_COTIZAVE = 'https://r.jina.ai/https://cotizave.com';
    const BRIDGE_BCV = 'https://r.jina.ai/https://www.bcv.org.ve/';
    const TIMEOUT_PROXY_MS = 8000;  // proxies (JSON pequeño)
    const TIMEOUT_BRIDGE_MS = 12000; // puentes (páginas grandes)
    const REFRESH_MS = 5 * 60 * 1000; // refresco automático cada 5 min

    /* ---------- Tasas VIVAS (null = sin datos aún; nada quemado) ---------- */
    const RATES = {
      bcv: { value: null, label: 'BCV' },
      binance: { value: null, label: 'Binance' },
      euro: { value: null, label: 'Euro' },
    };

    const state = { direction: 'usd-ves', rate: 'bcv' };

    /* ════════════════════════════════════════════════════════════════
     * 📊 MÓDULO DE COTIZACIONES — DRY
     * Fuente única de verdad de las 3 columnas: el HTML se genera una
     * sola vez desde este arreglo (sin bloques repetidos ni badges).
     * ════════════════════════════════════════════════════════════════ */
    const RATE_COLUMNS = [
      { id: 'bcv',     sigla: 'BCV', label: 'BCV oficial',  priceId: 'bcv-price' },
      { id: 'binance', sigla: 'BN',  label: 'Binance P2P',  priceId: 'bin-price' },
      { id: 'euro',    sigla: 'EU',  label: 'Euro BCV',     priceId: 'eur-price' },
    ];

    /* Monto con jerarquía: "Bs." tenue + cifra protagonista.
     * curCls/valCls permiten la misma lógica en tasas y en el resultado grande. */
    const moneyHtml = (currency, value, curCls = '', valCls = '') =>
      `<span${curCls ? ` class="${curCls}"` : ''}>${currency}</span><span${valCls ? ` class="${valCls}"` : ''}>${value}</span>`;

    function renderRateColumns() {
      const grid = document.getElementById('rates-grid');
      if (!grid) return;
      // Cada columna: sigla → nombre → monto.
      // Sin wrappers intermedios: 3 nodos por columna, todos con nowrap.
      grid.innerHTML = RATE_COLUMNS.map((c, i) => `
        <div class="rate-col" role="radio" aria-checked="${i === 0}" tabindex="${i === 0 ? 0 : -1}"
          data-rate-card="${c.id}" aria-label="Tasa ${c.label}">
          <span class="rate-sigla whitespace-nowrap text-xs font-medium uppercase tracking-wider text-white/50">${c.sigla}</span>
          <span class="rate-name whitespace-nowrap flex items-center gap-1 text-sm text-white/80">${c.label}</span>
          <p id="${c.priceId}" class="rate-price animate-pulse whitespace-nowrap transition-all duration-300 ease-in-out">${moneyHtml('Bs.', '—', 'rate-cur', '')}</p>
        </div>`).join('');
    }
    renderRateColumns();

    const $ = (sel) => document.querySelector(sel);
    const els = {
      amount: $('#amount'),
      swapBtn: $('#swap-btn'),
      swapLabel: $('#direction-label'),
      swapIcon: $('#swap-icon'),
      currencyTag: $('#currency-tag'),
      result: $('#result'),
      resultDetail: $('#result-detail'),
      rateTag: $('#rate-tag'),
      bcvPrice: $('#bcv-price'),
      binPrice: $('#bin-price'),
      eurPrice: $('#eur-price'),
    };
    // Mapa clave de tasa → elemento <p> del precio (nombres reales del DOM)
    const PRICE_ELS = { bcv: els.bcvPrice, binance: els.binPrice, euro: els.eurPrice };

    /* ---------- Formato venezolano estricto: 3.650,00 ---------- */
    const fmt = (n) =>
      new Intl.NumberFormat('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);

    /* ---------- Auto-ajuste tipográfico del resultado ----------
     * Si el monto tiene muchos dígitos, la fuente escala proporcionalmente
     * hacia abajo hasta que la línea quepa en el contenedor glass.
     * Nunca se rompe, salta de línea ni desborda. */
    function fitResultText() {
      const el = els.result;
      if (!el) return;
      el.style.fontSize = ''; // vuelve al tamaño base (text-4xl / sm:text-5xl)
      const base = parseFloat(getComputedStyle(el).fontSize);
      if (!Number.isFinite(base)) return;
      let size = base;
      let guard = 48; // tope de iteraciones por seguridad
      while (el.scrollWidth > el.clientWidth && size > 15 && guard-- > 0) {
        size -= 1.5;
        el.style.fontSize = `${size}px`;
      }
    }
    let fitRaf = 0;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(fitRaf);
      fitRaf = requestAnimationFrame(fitResultText);
    });

    const TZ = 'America/Caracas';

    /* ════════════════════════════════════════════════════════════════
     * 📅 FECHA Y HORA DE HOY EN CARACAS — siempre, sin importar el país
     * del cliente. Se formatea con locale 'es-VE' y ZONA FIJA
     * America/Caracas (UTC−4, sin horario de verano): el reloj del
     * dispositivo solo aporta el instante, nunca la zona.
     * ════════════════════════════════════════════════════════════════ */
    const caracasNowEl = document.getElementById('caracas-now');
    const caracasTextEl = document.getElementById('caracas-date-text');

    // "martes 13 de octubre de 2026" (formato venezolano, sin coma tras el día)
    const fmtCaracasFullDate = (d) =>
      new Intl.DateTimeFormat('es-VE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: TZ })
        .format(d).replace(/,\s*/, ' ');

    // "09:45" (24 h, hora de Caracas)
    const fmtCaracasClock = (d) =>
      new Intl.DateTimeFormat('es-VE', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ }).format(d);

    function renderCaracasNow() {
      if (!caracasTextEl) return;
      const now = new Date();
      // Texto plano (sin spans ni pesos): el contraste lo da la clase del <time>.
      caracasTextEl.textContent = `${fmtCaracasFullDate(now)} - ${fmtCaracasClock(now)}`;
      if (caracasNowEl) {
        caracasNowEl.setAttribute('datetime', now.toISOString()); // instante real en UTC (para máquinas)
        caracasNowEl.setAttribute('title', `Ahora en Caracas (UTC−4) · tu zona: ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocida'}`);
      }
    }

    // Refresco exacto al cambiar de minuto + al volver a la pestaña (reloj dormido)
    (() => {
      const tick = () => {
        renderCaracasNow();
        setTimeout(tick, 60000 - (Date.now() % 60000) + 60);
      };
      tick();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) renderCaracasNow(); });
    })();

    /* ---------- Cálculo reactivo ---------- */
    function compute() {
      const amount = parseFloat(els.amount.value);
      const rate = RATES[state.rate].value;
      const usdToVes = state.direction === 'usd-ves';
      const sourceCurrency = state.rate === 'euro' ? 'EUR' : 'USD';

      // Sin datos vivos todavía: nunca se calcula con valores por defecto.
      if (!Number.isFinite(rate)) {
        els.result.innerHTML = '<span class="result-ph">0,00</span>'; // placeholder idéntico al del input superior
        // Si ya llegó una respuesta (aunque parcial), la tasa elegida NO existe:
        // no queda en "cargando" eterno, se informa como no disponible.
        els.resultDetail.textContent = lastDetailError || (ratesArrived ? 'Tasa no disponible' : 'Cargando tasas en vivo…');
        fitResultText();
        return;
      }

      if (!Number.isFinite(amount) || amount < 0) {
        els.result.innerHTML = '<span class="result-ph">0,00</span>'; // placeholder idéntico al del input superior
        els.resultDetail.textContent = 'Introduce un monto válido';
        fitResultText();
        return;
      }

      const out = usdToVes ? amount * rate : amount / rate;
      els.result.textContent = fmt(out); // solo la cifra limpia: la etiqueta de la tarjeta ya nombra la divisa
      els.resultDetail.textContent =
        `${fmt(amount)} ${usdToVes ? sourceCurrency : 'VES'} ${usdToVes ? '×' : '÷'} ${fmt(rate)} (${RATES[state.rate].label})`;

      const sourceTag = usdToVes ? sourceCurrency : 'VES';
      els.currencyTag.textContent = sourceTag;
      fitResultText();
    }

    /* ---------- Dirección USD → VES / VES → USD ---------- */
    const COPY_SVG = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"></path>
      </svg>
    `;
    const CHECK_SVG = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5 9.2 16.7 19 6.9"></path>
      </svg>
    `;

    function sanitizeNumber(value) {
      const cleaned = String(value ?? '').replace(/[^\d,\.\-]/g, '').trim();
      if (!cleaned) return '';

      if (cleaned.includes(',') && cleaned.includes('.')) {
        return cleaned.replace(/\./g, '').replace(',', '.');
      }

      if (cleaned.includes(',')) {
        return cleaned.replace(',', '.');
      }

      return cleaned;
    }

    async function copyValueFromButton(button) {
      const target = button.dataset.copyTarget;
      const icon = button.querySelector('[data-copy-icon]');
      const value = target === 'amount'
        ? sanitizeNumber(els.amount.value)
        : (els.result.querySelector('.result-ph') ? '' : sanitizeNumber(els.result.textContent)); // el placeholder "0,00" no se copia

      if (!value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
        icon.innerHTML = CHECK_SVG;
        button.dataset.copied = 'true';       // CSS [.ios-icon-btn[data-copied]] → Volt #F0FF00
        setTimeout(() => {
          icon.innerHTML = COPY_SVG;
          delete button.dataset.copied;       // restaura el color base del hermano (simetría exacta)
        }, 2000);
      } catch (error) {
        console.error('[tasasve] No se pudo copiar al portapapeles:', error);
      }
    }

    document.querySelectorAll('.copy-btn').forEach((button) => {
      button.addEventListener('click', () => copyValueFromButton(button));
    });

    function updateClearButtonVisibility() {
      const shouldShow = String(els.amount.value).trim() !== '' && Number(els.amount.value) !== 0;
      // Simetría táctil: AMBOS botones de limpiar (monto y resultado) aparecen/desaparecen juntos
      document.querySelectorAll('.clear-btn').forEach((btn) => {
        btn.style.display = shouldShow ? 'inline-flex' : 'none';
      });
    }

    function clearAmount() {
      els.amount.value = '';
      compute();
      forceCursorToEnd();
      updateClearButtonVisibility();
    }

    document.querySelectorAll('.clear-btn').forEach((btn) => btn.addEventListener('click', clearAmount));

    function setDirection(dir) {
      state.direction = dir;
      const usdToVes = dir === 'usd-ves';

      els.swapLabel.textContent = usdToVes ? 'USD → VES' : 'VES → USD';
      const sourceBase = state.rate === 'euro' ? 'EUR' : 'USD';
      els.currencyTag.textContent = usdToVes ? sourceBase : 'VES';

      compute();
    }

    /* ↑↓: rotación por ESTADO (suma 180° por clic) → el ícono gira por
       completo incluso con un toque rápido, sin depender de mantener pulsado. */
    let swapRotation = 0;
    els.swapBtn.addEventListener('click', () => {
      swapRotation += 180;
      els.swapIcon.style.transition = 'transform .45s cubic-bezier(.22, 1, .36, 1)';
      els.swapIcon.style.transform = `rotate(${swapRotation}deg)`;
      setDirection(state.direction === 'usd-ves' ? 'ves-usd' : 'usd-ves');
    });

    function forceCursorToEnd() {
      const input = els.amount;
      const value = String(input.value ?? '');
      const end = value.length;

      if (typeof input.setSelectionRange === 'function') {
        requestAnimationFrame(() => {
          input.focus();
          input.setSelectionRange(end, end);
        });
      } else if (typeof input.selectionStart === 'number' && typeof input.selectionEnd === 'number') {
        input.selectionStart = end;
        input.selectionEnd = end;
      }
    }

    /* ---------- Eventos reactivos (sin recargar) ---------- */
    els.amount.addEventListener('focus', forceCursorToEnd);
    els.amount.addEventListener('click', forceCursorToEnd);
    els.amount.addEventListener('keyup', () => {
      forceCursorToEnd();
      updateClearButtonVisibility();
    });
    els.amount.addEventListener('input', () => {
      compute();
      forceCursorToEnd();
      updateClearButtonVisibility();
    });

    updateClearButtonVisibility();
    /* ---------- Selección de tasa: fuente única de verdad ----------
     * Las columnas del grid de cotizaciones son el ÚNICO selector. */
    const rateCards = Array.from(document.querySelectorAll('[data-rate-card]'));

    function selectRate(rateKey, { focusCard = false } = {}) {
      state.rate = rateKey;

      // Resalta la columna activa (fondo glass esmeralda) + roving tabindex
      rateCards.forEach((card) => {
        const selected = card.dataset.rateCard === rateKey;
        card.classList.toggle('rate-selected', selected);
        card.setAttribute('aria-checked', String(selected));
        card.tabIndex = selected ? 0 : -1;
      });

      // 2) Etiqueta de moneda, tasa activa y recálculo inmediato
      const sourceBase = rateKey === 'euro' ? 'EUR' : 'USD';
      els.currencyTag.textContent = state.direction === 'usd-ves' ? sourceBase : 'VES';
      els.rateTag.textContent = RATES[rateKey].label;   // refleja la tasa elegida
      // Sin tinte verde: la etiqueta conserva text-white/50 (misma jerarquía que "USD").

      if (focusCard) {
        const active = rateCards.find((c) => c.dataset.rateCard === rateKey);
        if (active) active.focus();
      }
      compute();
    }

    // Tap/clic en una columna del grid: la selecciona
    rateCards.forEach((card) => {
      card.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(8); // micro-feedback háptico (Android)
        selectRate(card.dataset.rateCard);
      });
      // Accesible con teclado: flechas navegan, Espacio/Enter selecciona
      card.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          selectRate(card.dataset.rateCard);
          return;
        }
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (step) {
          e.preventDefault();
          const idx = rateCards.indexOf(card);
          const next = rateCards[(idx + step + rateCards.length) % rateCards.length];
          selectRate(next.dataset.rateCard, { focusCard: true });
        }
      });
    });

    /* ---------- PWA: beforeinstallprompt ---------- */
    const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_STANDALONE =
      window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    const banner = $('#install-banner');
    const bannerInner = $('#install-banner-inner');
    const installBtn = $('#install-btn');
    const installDismiss = $('#install-dismiss');
    let deferredPrompt = null;

    function rememberInstallBannerHidden() {
      localStorage.setItem('guiaInstalacionOculta', 'true');
    }

    function hideInstallBanner() {
      if (!banner || !bannerInner) return;
      bannerInner.classList.remove('translate-y-0', 'opacity-100');
      bannerInner.classList.add('translate-y-[150%]', 'opacity-0');
      setTimeout(() => {
        banner.hidden = true;
        rememberInstallBannerHidden();
      }, 400);
    }

    function showBanner(iosMode = false) {
      const shouldHide = localStorage.getItem('guiaInstalacionOculta') === 'true';
      if (shouldHide) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;
      requestAnimationFrame(() => {
        bannerInner.classList.remove('translate-y-[150%]', 'opacity-0');
        bannerInner.classList.add('translate-y-0', 'opacity-100');
      });

      if (iosMode) {
        $('#install-sub').innerHTML =
          'En iPhone: pulsa <b class="text-[#F0FF00]">Compartir</b> y luego «Añadir a la pantalla de inicio».';
        installBtn.textContent = 'Entendido';
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!IS_STANDALONE) showBanner();
    });

    installBtn.addEventListener('click', async () => {
      hideInstallBanner();
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try {
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') hideInstallBanner();
      } catch (_) {}
      deferredPrompt = null;
    });

    installDismiss.addEventListener('click', () => hideInstallBanner());
    if (IS_IOS && !IS_STANDALONE) setTimeout(() => showBanner(true), 1200);

    /* ---------- API en vivo: fetch, render y refresco ---------- */

    async function fetchRates() {
      /* ── Capa de red compartida (única implementación) ───────────
       * pedirTexto: fetch con timeout + error enriquecido (status/cuerpo).
       * pedirJSON : pedirTexto + validación de JSON (detecta SPA fallback).
       * Todo fallo se diagnostica con pista accionable: nada en silencio. */
      const pedirTexto = async (url, { ms = TIMEOUT_BRIDGE_MS, headers } = {}) => {
        const ac = new AbortController();
        const timer = setTimeout(() => ac.abort(), ms);
        try {
          const res = await fetch(url, { headers, signal: ac.signal, cache: 'no-store' });
          if (!res.ok) {
            let cuerpo = '';
            try { cuerpo = (await res.text()).slice(0, 180).replace(/\s+/g, ' '); } catch (_) {}
            const err = new Error(`${url} → HTTP ${res.status} ${res.statusText}${cuerpo ? ` · cuerpo: ${cuerpo}` : ''}`);
            err.status = res.status;
            throw err;
          }
          return res.text();
        } catch (err) {
          if (err && err.name === 'AbortError') {
            console.error(`[tasasve] Timeout de red (${ms / 1000} s) en ${url}`);
          }
          throw err;
        } finally {
          clearTimeout(timer);
        }
      };

      const pedirJSON = async (url) => {
        const text = await pedirTexto(url, { ms: TIMEOUT_PROXY_MS, headers: { Accept: 'application/json' } });
        try {
          return JSON.parse(text);
        } catch (_) {
          const err = new Error(`${url} → la respuesta no es JSON válido (primeros bytes: ${text.slice(0, 60).replace(/\s+/g, ' ') || '(vacío)'})`);
          err.status = 200;
          throw err;
        }
      };

      const diagnostica = (label, err) => {
        const status = err && err.status;
        let pista = '';
        if (status === 401 || status === 403) {
          pista = 'API key ausente o inválida (header X-API-Key). Verifica COTIZAVE_API_KEY.';
        } else if (status === 500 && /missing_api_key/.test(String(err.message))) {
          pista = 'Falta la variable COTIZAVE_API_KEY en el hosting (Netlify → Site settings → Environment variables) y redeployar.';
        } else if (err instanceof TypeError) {
          pista = 'Posible bloqueo CORS, red caída o mixed-content: verifica que la URL use https:// en producción.';
        }
        console.error(`[tasasve] Fuente "${label}" falló:`, err && err.message ? err.message : err, pista ? `→ ${pista}` : '');
      };

      /* ── Cascada de fuentes ─────────────────────────────────────
       * 1-2) Proxies con key (prod → dev). 3) Puentes públicos en
       * paralelo, con fusión por mercado: gana el dato del BCV oficial. */
      const fuentesFallidas = [];

      for (const { label, url } of PROXY_SOURCES) {
        try {
          return await pedirJSON(url);
        } catch (err) {
          fuentesFallidas.push(label);
          diagnostica(label, err);
        }
      }

      const [bcvRes, cotizaveRes] = await Promise.allSettled([
        pedirTexto(BRIDGE_BCV),
        pedirTexto(BRIDGE_COTIZAVE),
      ]);

      // Fusiona por mercado en un mapa: primera escritura gana.
      // El orden de llamada garantiza prioridad BCV oficial > cotizave.
      const fusion = {};
      const tomar = (resultado, parser, label, soloMercados) => {
        if (resultado.status !== 'fulfilled') {
          diagnostica(label, resultado.reason);
          fuentesFallidas.push(label);
          return;
        }
        const parsed = parser(resultado.value);
        if (!parsed) {
          console.error(`[tasasve] ${label} respondió pero el parseo falló (formato cambiado).`);
          fuentesFallidas.push(label);
          return;
        }
        console.info(`[tasasve] Datos obtenidos desde ${label}.`);
        for (const rate of parsed.rates) {
          if (soloMercados && !soloMercados.includes(rate.market)) continue;
          if (!fusion[rate.market]) fusion[rate.market] = rate;
        }
      };

      tomar(bcvRes, parseBcvOfficial, 'bcv.org.ve');
      tomar(cotizaveRes, parseBridgeRates, 'cotizave.com', ['binance_p2p', 'bcv']);

      const rates = Object.values(fusion);
      if (rates.length) return { rates };

      // Ninguna fuente respondió: error explícito para el catch de loadRates
      const resumen = new Error(`Ninguna fuente de tasas respondió (${fuentesFallidas.join(' → ')}).`);
      diagnostica('resumen', resumen);
      throw resumen;
    }

    /* Extrae las tasas EN VIVO del sitio oficial del BCV (vía puente de lectura):
     *   "![Image 26](...euro-04_2.png) EUR" seguido de "**974,09309112**"
     *   "Fecha Valor: Lunes, 21 Septiembre 2026"
     * Devuelve USD (reference) y EUR (eur_reference) oficiales + fecha valor. */
    function parseBcvOfficial(text) {
      const num = (s) => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
      const rates = [];

      // Cada moneda aparece como "IMG CÓDIGO" + valor en negrita en la línea siguiente
      const monedas = [
        { market: 'eur_reference', code: 'EUR' },
        { market: 'reference', code: 'USD' },
      ];

      for (const { market, code } of monedas) {
        const re = new RegExp(`${code}\\s*\\n*\\s*\\*\\*([\\d.,]+)\\*\\*`);
        const m = text.match(re);
        if (m && Number.isFinite(num(m[1]))) {
          rates.push({ market, mid: num(m[1]), updated_at: new Date().toISOString(), source: 'bcv.org.ve' });
        }
      }
      return rates.length ? { rates } : null;
    }

    /* Extrae las tasas EN VIVO del texto de cotizave.com (formato estable):
     *   "BCV BCV oficial Vigente desde el jueves 17 de septiembre Bs.847,44"
     *   "BN Binance P2P 17 sep · 17:17 Bs.953,60"
     * 847,44 → miles con punto, decimales con coma. */
    function parseBridgeRates(text) {
      const num = (s) => parseFloat(s.replace(/\./g, '').replace(',', '.'));
      const rates = [];

      const bcv = text.match(/BCV\s+BCV oficial[^\n]*?Bs\.\s*([\d.,]+)/);
      if (bcv) {
        rates.push({ market: 'bcv', mid: num(bcv[1]), updated_at: new Date().toISOString() });
      }

      const bin = text.match(/BN\s+Binance P2P[^\n]*?Bs\.\s*([\d.,]+)/);
      if (bin) {
        rates.push({ market: 'binance_p2p', mid: num(bin[1]), updated_at: new Date().toISOString() });
      }

      return rates.length ? { rates } : null;
    }

    /* ---------- Parseo y render del payload de tasas ---------- */
    let ratesArrived = false; // true en cuanto llega cualquier payload (aunque sea parcial)

    /* Estado de error de conexión visible en la UI (pie de la calculadora).
     * Se pinta en rojo suave y persiste hasta que una carga vuelva a tener éxito. */
    let lastDetailError = null;

    function setConnectionError(message) {
      lastDetailError = message;
      els.resultDetail.textContent = message;
      els.bcvPrice.classList.remove('animate-pulse');
      els.binPrice.classList.remove('animate-pulse');
      els.eurPrice.classList.remove('animate-pulse');
    }

    function clearConnectionError() {
      lastDetailError = null;
    }

    function applyRates(payload) {
      try {
        const list = Array.isArray(payload && payload.rates) ? payload.rates : [];
        const byMarket = {};
        for (const r of list) {
          if (r && typeof r === 'object') byMarket[String(r.market || '').toLowerCase()] = r;
        }
        const pick = (...keys) => keys.map((k) => byMarket[k]).find((r) => r && Number.isFinite(r.mid));

        // Euro: market 'eur_reference' (respaldo: base 'EUR'). Optional
        // chaining + fallback 0: la estructura puede cambiar sin colapsar.
        const eur =
          list.find((rate) => rate && rate.market === 'eur_reference') ||
          list.find((rate) => rate && rate.base === 'EUR');
        const euroRate = Number(eur?.mid) || 0;

        const encontradas = {
          bcv: pick('reference', 'bcv', 'bcv_oficial'),
          binance: pick('binance_p2p', 'binance'),
          euro: euroRate > 0 ? { mid: euroRate, ...eur } : null,
        };

        // Render uniforme: valor en la columna + loader apagado por tasa
        for (const [key, rate] of Object.entries(encontradas)) {
          if (!rate) continue;
          RATES[key].value = rate.mid;
          const priceEl = PRICE_ELS[key];
          // Prefijo "Bs." tenue + cifra en Space Grotesk: «Bs. 1.008,55» en UNA línea
          priceEl.innerHTML = moneyHtml('Bs.', fmt(rate.mid), 'rate-cur', '');
          priceEl.classList.remove('animate-pulse');
        }
      } catch (err) {
        // Requerimiento 3: un payload inesperado NUNCA debe dejar la UI colgada.
        console.error('[tasasve] Error procesando las tasas (payload inesperado):', err);
      } finally {
        ratesArrived = true;
        clearConnectionError(); // un payload exitoso limpia cualquier error previo
        if (RATES.euro.value == null) {
          console.warn('[tasasve] El payload recibido NO incluyó la tasa del Euro (market "eur_reference" / base "EUR").');
        }
        compute(); // recalcula al instante con los datos vivos disponibles
      }
    }

    let lastLoad = 0;

    /* Apaga el estado de carga SIEMPRE: éxito, error de red o payload corrupto. */
    function stopLoading() {
      els.bcvPrice.classList.remove('animate-pulse');
      els.binPrice.classList.remove('animate-pulse');
      els.eurPrice.classList.remove('animate-pulse');

      // Error de conexión activo: se muestra tal cual (estado rojo persistente)
      if (lastDetailError) {
        els.resultDetail.textContent = lastDetailError;
        return;
      }

      const hasData = RATES.bcv.value != null || RATES.binance.value != null || RATES.euro.value != null;
      if (hasData) {
        compute(); // repinta con el estado real ('Tasa no disponible' si faltó alguna)
      } else {
        els.resultDetail.textContent = 'Sin conexión con la API';
      }
    }

    async function loadRates() {
      const now = Date.now();
      if (now - lastLoad < 30 * 1000) return; // anti-spam al cambiar de pestaña
      lastLoad = now;
      try {
        const payload = await fetchRates();
        applyRates(payload); // el parseo ya está protegido con try/catch/finally interno
      } catch (err) {
        // Estado visual claro en producción: nada de quedarse congelado ni en guion indefinido
        console.error('[tasasve] No se pudieron obtener las tasas:', err);
        setConnectionError('Error de conexión con la API');
      } finally {
        stopLoading(); // el loader SIEMPRE se apaga, con o sin datos
      }
    }

    /* ---------- Arranque ---------- */
    selectRate(state.rate || 'bcv'); // estado inicial sincronizado: tarjetas + píldoras + cálculo
    loadRates();
    setInterval(loadRates, REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRates();
    });

    // Hook de depuración (no afecta producción): window.__tasasVE.loadRates()
    window.__tasasVE = { applyRates, loadRates, stopLoading, selectRate, fetchRates, RATES };
  })();
  </script>
</body>
