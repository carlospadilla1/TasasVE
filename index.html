<!DOCTYPE html>
<html lang="es-VE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tasas Venezuela · Dólar BCV y P2P en vivo</title>
  <meta name="description" content="Calculadora y tasas de cambio del dólar en Venezuela (BCV y Binance P2P) en vivo. PWA instalable." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#242424" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tasas VE" />
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
            num: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          },
          letterSpacing: {
            tight: '-0.02em',
          },
        },
      },
    };
  </script>

  <style>

    input[type='number']::-webkit-outer-spin-button,
    input[type='number']::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type='number'] { -moz-appearance: textfield; appearance: textfield; }

    :focus-visible { outline: 2px solid #10B981; outline-offset: 2px; }

    ::selection { background: #D1FAE5; color: #064E3B; }

    .result-badge {
      display: inline-flex; align-items: center; justify-content: center;
      margin: 16px auto 0;
      padding: 5px 14px;
      border-radius: 9999px;
      background-color: #10B981;
      color: #FFFFFF;
      box-shadow: 0 8px 18px -10px rgba(16, 185, 129, .55);
      font-size: 12px; font-weight: 600;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      pointer-events: none;
      z-index: 50;
      opacity: 0.06;

      background-size: 180px 180px;
      background-repeat: repeat;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: strict;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #stage > *,
    #center > * { min-width: 0; }

    body #stage {
      gap: 0;
      overscroll-behavior: contain;
      padding-top: var(--air-top);
      padding-bottom: 0;
    }
    body #stage > header { margin-bottom: var(--air-dock); }
    body #center {
      flex: 0 1 auto;
      margin-top: auto;
      margin-bottom: auto;
    }

    .dock { position: relative; }

    .dock-nav { margin-bottom: clamp(5rem, 11dvh, 8rem); }

    .dock-inner {
      padding-top: var(--air-dock);
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    }
    .dock-copy { color: rgba(255, 255, 255, .72); }

    @keyframes clockColonBlink {
      0%, 100% { opacity: 1; }
      50%      { opacity: .15; }
    }
    .clock-colon {
      display: inline-block;
      animation: clockColonBlink 1s ease-in-out infinite;
    }

    /* Layout */
    html, body {
      height: 100vh;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, .ornament-ball { -webkit-tap-highlight-color: transparent; }
    body {
      --air-top: calc(2rem + min(1.5rem, max(0px, (100dvh - 821px) * 0.75)));
      --air-dock: 1rem;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: #242424 !important;
      background-image: linear-gradient(
        180deg,
        #242424 0%,
        #242424 32%,
        #18392B 58%,
        #0A6847 80%,
        #064E3B 100%
      ) !important;
      touch-action: manipulation;
    }

    /* Glass */
    .ios-liquid-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, .16) 0%, rgba(255, 255, 255, .08) 100%);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, .22);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .22), inset 0 1px 1px rgba(255, 255, 255, .28);
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: layout paint;
    }

    .ios-glass-btn {
      border-color: rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .14);
    }

    .swap-btn {
      background-color: #10B981;
      border: 1px solid rgba(255, 255, 255, .65);
      box-shadow: 0 0 0 5px rgba(6, 40, 30, .55), 0 10px 24px -8px rgba(16, 185, 129, .50);
    }
    .swap-btn:hover { background-color: #059669; }

    .ios-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; flex-shrink: 0;
      border-radius: 12px;
      color: rgba(255, 255, 255, .8);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: all .2s ease;
    }
    .ios-icon-btn:hover { color: #FFFFFF; border-color: rgba(255, 255, 255, .28); background-color: rgba(255, 255, 255, .24); }
    .ios-icon-btn:active { transform: scale(.94); color: #FFFFFF; border-color: rgba(255, 255, 255, .28); }
    .ios-icon-btn:focus-visible { outline: 2px solid #6EE7B7; outline-offset: 2px; }
    .ios-icon-btn[data-copied] { color: #6EE7B7; }

    .currency-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px 3px 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .25);
      line-height: 1; user-select: none;
    }

    .currency-flag {
      display: block; width: 16px; height: 11px; flex-shrink: 0;
      border-radius: 2px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .25);
    }
    .currency-code {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: .875rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      color: #FFFFFF;
    }

    .amount-card .currency-pill {
      background: rgba(16, 185, 129, .18);
      border-color: #10B981;
    }
    .amount-card .currency-code { color: #6EE7B7; }

    .amount-card {
      cursor: pointer;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .amount-card input { cursor: text; }

    .amount-card:focus-within {
      border-color: rgba(16, 185, 129, .55);
      box-shadow:
        0 0 0 1px rgba(16, 185, 129, .35),
        0 8px 26px -14px rgba(16, 185, 129, .45),
        0 12px 32px rgba(0, 0, 0, .28),
        inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .result-card { cursor: default; }

    /* Rates */
    .rates-glass {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));   
      overflow: hidden;
      width: 100%;
      padding: 22px 8px;                                  
      border-radius: 20px;
    }

    .rates-glass > .rate-col:not(:last-child) { border-right: 1px solid rgba(255, 255, 255, .15); }

    .rate-col {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px;                                           
      min-width: 0; padding: 10px 6px;
      white-space: nowrap;                                
      text-align: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      opacity: .78;                                        
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
    }
    .rate-col:hover { opacity: 1; }
    .rate-col:active { transform: scale(.98); }
    .rate-col:focus-visible { outline: 2px solid #10B981; outline-offset: -2px; border-radius: 12px; }

    .rate-col .rate-price {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 700;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }

    .rate-cur { font-size: .75rem; font-weight: 500; color: rgba(255, 255, 255, .6); margin-right: .25rem; }

    .result-ph { color: rgba(255, 255, 255, .28); }

    .rate-col::after {
      content: '';
      position: absolute; left: 50%; bottom: 1px;
      width: 16px; height: 2px; border-radius: 2px;
      transform: translateX(-50%);
      background: #34D399;
      box-shadow: 0 0 8px rgba(52, 211, 153, .55);
      opacity: 0; transition: opacity .25s ease;
    }
    .rate-col.rate-selected,
    .rate-col.rate-selected:hover {
      opacity: 1;

      background: radial-gradient(ellipse closest-side at center, rgba(52, 211, 153, .22) 0%, rgba(52, 211, 153, .10) 38%, rgba(52, 211, 153, .04) 66%, transparent 100%);
    }
    .rate-col.rate-selected .rate-sigla { color: #34D399; font-weight: 600; letter-spacing: .05em; }
    .rate-col.rate-selected::after { opacity: 1; }

    #result { white-space: nowrap; }

    @media (max-height: 820px) {
      body { --air-top: 12px; --air-dock: 10px; }
      body #center { gap: 12px; }
      body #amount { font-size: 2.5rem; }
      body #result { font-size: 1.875rem; }
      body .amount-card,
      body .result-card { padding: 12px 16px; }
      body .rates-glass { padding: 14px 8px; }
      body .result-badge { margin-top: 8px; }
      body .quick-icon { width: 40px; height: 40px; }
      body .quick-label { font-size: 9px; }
    }

    @media (max-height: 580px) {
      body { --air-top: 3px; --air-dock: 6px; }
      body #center { gap: 8px; }
      body #caracas-date-text { font-size: 1.4rem; }
      body .rates-glass { padding: 6px; }
      body .amount-card,
      body .result-card { padding: 10px 16px; }

      body .dock-nav { margin-bottom: 4.5rem; }
      body .result-badge { margin-top: 3px; }
    }

    @media (max-height: 560px) {
      body .dock-nav { margin-bottom: 4.25rem; }
      body .rates-glass { padding: 10px 8px; }
      body .result-badge { margin-top: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .clock-colon { animation: none; }
      .ornament { animation: none; }
      .bauble-impulse { animation: none !important; }
      * { transition-duration: 0.01ms !important; }
    }

    /* Dock nav */
    .quick-action {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 0; background: none; border: 0; color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-icon {
      display: grid; place-items: center;
      width: 52px; height: 52px; border-radius: 999px;
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .30);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
      color: rgba(255, 255, 255, .75);
      transition: transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
    }
    .quick-action:hover .quick-icon { background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .34); color: #FFFFFF; }
    .quick-action:active .quick-icon { transform: scale(.94); }
    .quick-action:focus-visible .quick-icon { outline: 2px solid #6EE7B7; outline-offset: 3px; }
    .quick-label { font-size: 10px; line-height: 1.1; letter-spacing: .01em; color: rgba(255, 255, 255, .75); }

    .quick-action.is-active .quick-icon {
      background: #D1FAE5;
      border-color: rgba(255, 255, 255, .90);
      color: #059669;
      box-shadow: 0 0 0 4px rgba(209, 250, 229, .18), 0 10px 22px -10px rgba(0, 0, 0, .55);
    }
    .quick-action.is-active .quick-label { color: #FFFFFF; font-weight: 600; }

    /* Ambient VFX */
    .christmas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 140px;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: layout style paint;
    }

    .ornament {
      position: absolute;
      top: 0;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    .ornament-swing {
      transform-origin: 50% 0%;
      animation-name: ornamentSwing;
      animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
      animation-iteration-count: infinite;
      animation-direction: alternate;
      will-change: transform;
    }

    .ornament--far .ornament-swing { animation-name: ornamentSwingFar; }

    .ornament-thread {
      display: block;
      width: .5px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, .05) 100%);
    }

    .ornament-ball { display: block; pointer-events: auto; cursor: pointer; }

    .bauble-impulse {
      transform-box: view-box;
      transform-origin: 50% 0%;
      will-change: transform;
    }

    .bauble-impulse.is-bouncing {
      animation: smooth-nudge 1.6s cubic-bezier(0.25, 1, 0.5, 1) both;
    }

    .ornament:has(.bauble-impulse.is-bouncing) .ornament-sparkle {
      animation: sparkle-flash 1.1s ease-out;
    }

    @keyframes smooth-nudge {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(9deg); }
      45%  { transform: rotate(-6.5deg); }
      68%  { transform: rotate(3.5deg); }
      85%  { transform: rotate(-1.5deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes sparkle-flash {
      0%   { opacity: .2; }
      40%  { opacity: .95; }
      100% { opacity: .7; }
    }

    .ornament-sparkle {
      position: absolute;
      fill: rgba(255, 255, 255, .95);
      filter: blur(.5px) drop-shadow(0 0 2px rgba(253, 230, 138, .65));
      animation: twinkle 3.4s ease-in-out infinite;
    }

    .ornament-1 { left: 62%; filter: blur(2.5px) drop-shadow(0 0 12px rgba(16, 185, 129, .35)); opacity: .85; }
    .ornament-1 .ornament-swing { animation-duration: 6.7s; animation-delay: -1.2s; }
    .ornament-1 .ornament-thread { height: 62px; }
    .ornament-1 .ornament-ball { width: 44px; height: 44px; }

    .ornament-2 { left: 78%; filter: blur(2.5px) drop-shadow(0 0 12px rgba(245, 158, 11, .35)); opacity: .85; }
    .ornament-2 .ornament-swing { animation-duration: 5.2s; animation-delay: -2.8s; }
    .ornament-2 .ornament-thread { height: 48px; }
    .ornament-2 .ornament-ball { width: 40px; height: 40px; }

    .ornament-3 { left: 93%; filter: blur(2.5px) drop-shadow(0 0 12px rgba(239, 68, 68, .35)); opacity: .85; }
    .ornament-3 .ornament-swing { animation-duration: 7.9s; animation-delay: -3.6s; }
    .ornament-3 .ornament-thread { height: 30px; }
    .ornament-3 .ornament-ball { width: 36px; height: 36px; }

    .ornament-4 { left: 12%; filter: blur(6px) drop-shadow(0 0 10px rgba(245, 158, 11, .30)); opacity: .50; }
    .ornament-4 .ornament-swing { animation-duration: 9.1s; animation-delay: -4.5s; }
    .ornament-4 .ornament-thread { height: 34px; }
    .ornament-4 .ornament-ball { width: 22px; height: 22px; }

    .ornament-5 { left: 70%; filter: blur(6px) drop-shadow(0 0 10px rgba(239, 68, 68, .30)); opacity: .50; }
    .ornament-5 .ornament-swing { animation-duration: 9.1s; animation-delay: -6.2s; }
    .ornament-5 .ornament-thread { height: 20px; }
    .ornament-5 .ornament-ball { width: 18px; height: 18px; }

    .ornament-6 { left: 87%; filter: blur(6px) drop-shadow(0 0 10px rgba(16, 185, 129, .30)); opacity: .50; }
    .ornament-6 .ornament-swing { animation-duration: 7.9s; animation-delay: -5.1s; }
    .ornament-6 .ornament-thread { height: 26px; }
    .ornament-6 .ornament-ball { width: 26px; height: 26px; }

    .ornament-7 { left: 24%; filter: blur(6px) drop-shadow(0 0 10px rgba(16, 185, 129, .30)); opacity: .50; }
    .ornament-7 .ornament-swing { animation-duration: 8.3s; animation-delay: -3.1s; }
    .ornament-7 .ornament-thread { height: 40px; }
    .ornament-7 .ornament-ball { width: 20px; height: 20px; }

    .ornament-8 { left: 2%; filter: blur(2.5px) drop-shadow(0 0 12px rgba(239, 68, 68, .35)); opacity: .85; }
    .ornament-8 .ornament-swing { animation-duration: 6.7s; animation-delay: -2.1s; }
    .ornament-8 .ornament-thread { height: 24px; }
    .ornament-8 .ornament-ball { width: 38px; height: 38px; }

    .ornament-9 { left: 36%; filter: blur(6px) drop-shadow(0 0 10px rgba(239, 68, 68, .30)); opacity: .50; }
    .ornament-9 .ornament-swing { animation-duration: 9.1s; animation-delay: -6.9s; }
    .ornament-9 .ornament-thread { height: 30px; }
    .ornament-9 .ornament-ball { width: 24px; height: 24px; }

    .sparkle-a { left: -14px; top: 46px;  width: 9px; height: 9px; }
    .sparkle-b { right: -12px; top: 64px; width: 7px; height: 7px; animation-delay: -1.1s; }
    .sparkle-c { left: -10px; top: 26px;  width: 6px; height: 6px; animation-delay: -2.2s; }
    .sparkle-d { right: -14px; top: 40px; width: 8px; height: 8px; animation-delay: -.6s; }

    @keyframes ornamentSwing {
      from { transform: rotate3d(0, 0, 1, -3.5deg); }
      to   { transform: rotate3d(0, 0, 1, 3.5deg); }
    }

    @keyframes ornamentSwingFar {
      from { transform: rotate3d(0, 0, 1, -1.8deg); }
      to   { transform: rotate3d(0, 0, 1, 1.8deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.7); }
      50%      { opacity: .9;  transform: scale(1.1); }
    }

    /* Snow */
    .snow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
      transform: translateZ(0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: layout style paint;
    }

    .snow-flake {
      position: absolute;
      top: -6vh;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 255, 255, .85) 0%, rgba(16, 185, 129, .2) 50%, transparent 100%);
      box-shadow: 0 0 0 .5px rgba(16, 185, 129, .20), 0 0 4px rgba(16, 185, 129, .16);
      animation-name: snowFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      will-change: transform;
    }

    @keyframes snowFall {
      0%   { transform: translate3d(0, 0, 0); opacity: 0; }
      8%   { opacity: 1; }
      38%  { transform: translate3d(var(--drift, 6px), 38dvh, 0); }
      72%  { transform: translate3d(calc(var(--drift, 6px) * -1), 74dvh, 0); }
      100% { transform: translate3d(0, 106dvh, 0); opacity: .8; }
    }

  </style>
</head>

        </div>

    </div>

    <div class="ornament ornament--far ornament-7">
      <div class="ornament-swing">
        <div class="bauble-impulse">
        <span class="ornament-thread"></span>
        <svg class="ornament-ball" viewBox="0 0 48 48">
          <defs><radialGradient id="orbH" cx="34%" cy="26%" r="78%">
            <stop offset="0%" stop-color="#6EE7B7"/><stop offset="45%" stop-color="#10B981"/><stop offset="100%" stop-color="#065F46"/>
          </radialGradient></defs>
          <rect x="20" y="1" width="8" height="4" rx="1.5" fill="#FDE68A"/>
          <circle cx="24" cy="28" r="19" fill="url(#orbH)"/>
          <ellipse cx="16" cy="19" rx="6" ry="4" fill="#FFFFFF" opacity=".30"/>
        </svg>
        </div>

    </div>

    <div class="ornament ornament--far ornament-9">
      <div class="ornament-swing">
        <div class="bauble-impulse">
        <span class="ornament-thread"></span>
        <svg class="ornament-ball" viewBox="0 0 48 48">

  (() => {
    'use strict';

    const NUM_FMT = new Intl.NumberFormat('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const DT_FMT = new Intl.DateTimeFormat('es-VE', {
      weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true,
    });

    const PROXY_SOURCES = [
      { label: 'proxy-netlify', url: '/.netlify/functions/rates' },
      { label: 'proxy-local', url: './api/rates' },
    ];
    // Rates API
    const BRIDGE_COTIZAVE = 'https://r.jina.ai/https://cotizave.com';
    const BRIDGE_BCV = 'https://r.jina.ai/https://www.bcv.org.ve/';
    const TIMEOUT_PROXY_MS = 8000;
    const TIMEOUT_BRIDGE_MS = 12000;
    const REFRESH_MS = 5 * 60 * 1000;

    const RATES = {
      bcv: { value: null, label: 'BCV' },
      binance: { value: null, label: 'Binance' },
      euro: { value: null, label: 'Euro' },
    };

    const state = { direction: 'usd-ves', rate: 'bcv' };

    const fmt = (n) => formatLocalNumber(n);

    const RATES_CACHE_KEY = 'tasasve:rates:v1';
    const RATES_CACHE_TTL_MS = REFRESH_MS;

    let cacheSavedAt = 0;
    let ratesArrived = false;

    function readRatesCache() {
      try {
        const raw = localStorage.getItem(RATES_CACHE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved !== 'object' || !saved.values) return null;

        const values = {};
        for (const key of Object.keys(RATES)) {
          const value = Number(saved.values[key]);
          if (Number.isFinite(value) && value > 0) values[key] = value;
        }
        if (!Object.keys(values).length) return null;
        return { savedAt: Number(saved.savedAt) || 0, values };
      } catch (error) {
        console.warn('[tasasve] Caché local ilegible, se ignora:', error);
        return null;
      }
    }

    function writeRatesCache() {
      try {
        const values = {};
        for (const key of Object.keys(RATES)) {
          if (Number.isFinite(RATES[key].value)) values[key] = RATES[key].value;
        }
        if (!Object.keys(values).length) return;
        cacheSavedAt = Date.now();
        localStorage.setItem(RATES_CACHE_KEY, JSON.stringify({ savedAt: cacheSavedAt, values }));
      } catch (error) {
        console.warn('[tasasve] No se pudo guardar la caché local:', error);
      }
    }

    const isCacheFresh = () => cacheSavedAt > 0 && Date.now() - cacheSavedAt < RATES_CACHE_TTL_MS;

    const cachedRates = readRatesCache();
    if (cachedRates) {
      cacheSavedAt = cachedRates.savedAt;
      for (const key of Object.keys(cachedRates.values)) RATES[key].value = cachedRates.values[key];
      ratesArrived = true;
    }

    const RATE_COLUMNS = [
      { id: 'bcv',     sigla: 'BCV', label: 'BCV oficial',  priceId: 'bcv-price' },
      { id: 'binance', sigla: 'BN',  label: 'Binance P2P',  priceId: 'bin-price' },
      { id: 'euro',    sigla: 'EU',  label: 'Euro BCV',     priceId: 'eur-price' },
    ];

    const moneyHtml = (currency, value, curCls = '', valCls = '') =>
      `<span${curCls ? ` class="${curCls}"` : ''}>${currency}</span><span${valCls ? ` class="${valCls}"` : ''}>${value}</span>`;

    function renderRateColumns() {
      const grid = document.getElementById('rates-grid');
      if (!grid) return;
      grid.innerHTML = RATE_COLUMNS.map((c, i) => `
        <div class="rate-col" role="radio" aria-checked="${i === 0}" tabindex="${i === 0 ? 0 : -1}"
          data-rate-card="${c.id}" aria-label="Tasa ${c.label}">
          <span class="rate-sigla whitespace-nowrap text-xs font-medium uppercase tracking-wider text-white/60">${c.sigla}</span>
          <span class="rate-name whitespace-nowrap flex items-center gap-1 text-sm text-white/60">${c.label}</span>
          <p id="${c.priceId}" class="rate-price whitespace-nowrap transition-all duration-300 ease-in-out">${moneyHtml('Bs.', Number.isFinite(RATES[c.id].value) ? fmt(RATES[c.id].value) : '—', 'rate-cur', '')}</p>
        </div>`).join('');
    }
    renderRateColumns();

    function updateRatePrices() {
      for (const c of RATE_COLUMNS) {
        const el = document.getElementById(c.priceId);
        if (!el) continue;
        const value = RATES[c.id].value;
        el.innerHTML = moneyHtml('Bs.', Number.isFinite(value) ? fmt(value) : '—', 'rate-cur', '');
      }
    }

    // DOM refs
    const $ = (sel) => document.querySelector(sel);
    const els = {
      amount: $('#amount'),
      swapBtn: $('#swap-btn'),
      swapLabel: $('#direction-label'),
      swapIcon: $('#swap-icon'),
      currencyTag: $('#currency-tag'),
      result: $('#result'),
      resultDetail: $('#result-detail'),
      rateTag: $('#rate-tag'),
    };

    const CURRENCY_META = {
      USD: {
        name: 'Dólar estadounidense',
        flag: '<svg class="currency-flag" viewBox="0 0 16 11" aria-hidden="true"><rect width="16" height="11" fill="#F2F2F2"/><g fill="#B22234"><rect width="16" height="1.6"/><rect y="3.2" width="16" height="1.6"/><rect y="6.4" width="16" height="1.6"/><rect y="9.6" width="16" height="1.4"/></g><rect width="7" height="6.4" fill="#3C3B6E"/></svg>',
      },
      EUR: {
        name: 'Euro',
        flag: '<svg class="currency-flag" viewBox="0 0 16 11" aria-hidden="true"><rect width="16" height="11" fill="#003399"/><circle cx="8" cy="5.5" r="2.7" fill="none" stroke="#FFCC00" stroke-width=".8" stroke-linecap="round" stroke-dasharray=".7 .62"/></svg>',
      },
      VES: {
        name: 'Bolívar',
        flag: '<svg class="currency-flag" viewBox="0 0 16 11" aria-hidden="true"><rect width="16" height="11" fill="#FFCC00"/><rect y="3.7" width="16" height="3.6" fill="#00247D"/><rect y="7.3" width="16" height="3.7" fill="#CF142B"/><g fill="#fff"><circle cx="5" cy="5.4" r=".5"/><circle cx="7" cy="4.6" r=".5"/><circle cx="9" cy="4.6" r=".5"/><circle cx="11" cy="5.4" r=".5"/><circle cx="6" cy="6.4" r=".5"/><circle cx="10" cy="6.4" r=".5"/></g></svg>',
      },
    };

    function setCurrencyPill(el, code) {
      const meta = CURRENCY_META[code];
      if (!el || !meta || el.dataset.currency === code) return;
      el.dataset.currency = code;
      el.innerHTML = meta.flag + `<span class="currency-code">${code}</span>`;
      el.setAttribute('aria-label', `${meta.name} (${code})`);
    }

    let lastFit = '';
    function fitResultText() {
      const el = els.result;
      if (!el) return;
      const sig = `${el.textContent.length}:${el.clientWidth}`;
      if (sig === lastFit) return;
      lastFit = sig;
      el.style.fontSize = '';
      const base = parseFloat(getComputedStyle(el).fontSize);
      if (!Number.isFinite(base)) return;
      let size = base;
      let guard = 48;
      while (el.scrollWidth > el.clientWidth && size > 15 && guard-- > 0) {
        size -= 1.5;
        el.style.fontSize = `${size}px`;
      }
    }
    let fitRaf = 0;
    window.addEventListener('resize', () => {
      cancelAnimationFrame(fitRaf);
      fitRaf = requestAnimationFrame(fitResultText);
    });

    const nowEl      = document.getElementById('caracas-now');
    const greetingEl = document.getElementById('greeting');
    const dateTextEl = document.getElementById('caracas-date-text');
    const metaEl     = document.getElementById('caracas-meta');

    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const MONTHS_SHORT = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

    function localParts(d) {
      const p = {};
      for (const part of DT_FMT.formatToParts(d)) {
        if (part.type !== 'literal') p[part.type] = part.value;
      }
      const hour12 = Number(p.hour);
      const ampm = /p/i.test(p.dayPeriod || '') ? 'PM' : 'AM';
      const hour24 = (hour12 % 12) + (ampm === 'PM' ? 12 : 0);
      return {
        weekday: p.weekday,
        day: p.day,
        month: MONTHS_SHORT[Number(p.month) - 1] || '',
        year: p.year,
        hour12, minute: p.minute, ampm, hour24,
      };
    }

    const greetingFor = (hour24) =>
      hour24 >= 6 && hour24 < 12 ? '¡Buen día!'
        : hour24 >= 12 && hour24 < 19 ? '¡Buenas tardes!'
          : '¡Buenas noches!';

    function renderMeta(t) {
      if (!metaEl) return;
      const colon = document.createElement('span');
      colon.className = 'clock-colon';
      colon.textContent = ':';
      metaEl.textContent = '';
      metaEl.append(`${t.year} • ${t.hour12}`, colon, `${t.minute} ${t.ampm}`);
    }

    // Header clock
    function renderHeaderClock() {
      if (!dateTextEl) return;
      const now = new Date();
      const t = localParts(now);
      dateTextEl.textContent = `${cap(t.weekday)}, ${t.day} ${t.month}`;
      renderMeta(t);
      if (greetingEl) greetingEl.textContent = greetingFor(t.hour24);
      if (nowEl) {
        nowEl.setAttribute('datetime', now.toISOString());
        nowEl.setAttribute('title', `Hora local · ${Intl.DateTimeFormat().resolvedOptions().timeZone || 'zona desconocida'}`);
      }
    }

    (() => {
      const tick = () => {
        renderHeaderClock();
        setTimeout(tick, 60000 - (Date.now() % 60000) + 60);
      };
      tick();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) renderHeaderClock(); });
    })();

    // Reactive compute
    function compute() {
      const amount = parseLocalNumber(els.amount.value);
      const rate = RATES[state.rate].value;
      const usdToVes = state.direction === 'usd-ves';
      const sourceCurrency = state.rate === 'euro' ? 'EUR' : 'USD';

      setCurrencyPill(els.currencyTag, usdToVes ? sourceCurrency : 'VES');
      setCurrencyPill(els.rateTag, usdToVes ? 'VES' : sourceCurrency);

      if (!Number.isFinite(rate)) {
        els.result.innerHTML = '<span class="result-ph">0,00</span>';
        els.resultDetail.textContent = lastDetailError || (ratesArrived ? 'Tasa no disponible' : 'Cargando tasas en vivo…');
        fitResultText();
        return;
      }

      if (!Number.isFinite(amount) || amount < 0) {
        els.result.innerHTML = '<span class="result-ph">0,00</span>';
        els.resultDetail.textContent = 'Introduce un monto válido';
        fitResultText();
        return;
      }

      const out = usdToVes ? amount * rate : amount / rate;
      els.result.textContent = formatLocalNumber(out);
      els.resultDetail.textContent =
        `${formatLocalNumber(amount)} ${usdToVes ? sourceCurrency : 'VES'} ${usdToVes ? '×' : '÷'} ${formatLocalNumber(rate)} (${RATES[state.rate].label})`;

      fitResultText();
    }

    const COPY_SVG = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2"></rect>
        <path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"></path>
      </svg>
    `;
    const CHECK_SVG = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12.5 9.2 16.7 19 6.9"></path>
      </svg>
    `;

    function sanitizeNumber(value) {
      const cleaned = String(value ?? '').replace(/[^\d,\.\-]/g, '').trim();
      if (!cleaned) return '';

      if (cleaned.includes(',') && cleaned.includes('.')) {
        return cleaned.replace(/\./g, '').replace(',', '.');
      }

      if (cleaned.includes(',')) {
        return cleaned.replace(',', '.');
      }

      return cleaned;
    }

    // Locale number parser
    function parseLocalNumber(str) {
      const s = String(str ?? '').trim();
      if (!s) return NaN;
      return parseFloat(s.replace(/\./g, '').replace(',', '.'));
    }

    function formatLocalNumber(num) {
      if (!Number.isFinite(num)) return '';
      return NUM_FMT.format(num);
    }

    function maskLocalNumber(raw) {
      const parts = String(raw ?? '').replace(/\./g, '').replace(/[^\d,]/g, '').split(',');
      const int = parts[0].replace(/^0+(?=\d)/, '');
      const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      if (parts.length === 1) return grouped;
      return `${grouped || '0'},${parts[1].slice(0, 2)}`;
    }

    function insertDecimal() {
      const input = els.amount;
      if (input.value.includes(',')) return;
      const base = maskLocalNumber(input.value) || '0';
      input.value = `${base},`;
      const end = input.value.length;
      if (typeof input.setSelectionRange === 'function') input.setSelectionRange(end, end);
      compute();
      updateClearButtonVisibility();
    }

    function normalizeAmountField() {
      const before = els.amount.value;
      const after = maskLocalNumber(before);
      if (after === before) return false;
      els.amount.value = after;
      return true;
    }

    async function copyValueFromButton(button) {
      const target = button.dataset.copyTarget;
      const icon = button.querySelector('[data-copy-icon]');
      const value = target === 'amount'
        ? sanitizeNumber(els.amount.value)
        : (els.result.querySelector('.result-ph') ? '' : sanitizeNumber(els.result.textContent));

      if (!value) {
        return;
      }

      try {
        await navigator.clipboard.writeText(value);
        icon.innerHTML = CHECK_SVG;
        button.dataset.copied = 'true';
        setTimeout(() => {
          icon.innerHTML = COPY_SVG;
          delete button.dataset.copied;
        }, 2000);
      } catch (error) {
        console.error('[tasasve] No se pudo copiar al portapapeles:', error);
      }
    }

    document.querySelectorAll('.copy-btn').forEach((button) => {
      button.addEventListener('click', () => copyValueFromButton(button));
    });

    const clearBtns = Array.from(document.querySelectorAll('.clear-btn'));

    function updateClearButtonVisibility() {
      const raw = String(els.amount.value).trim();
      const value = parseLocalNumber(raw);
      const shouldShow = raw !== '' && !(Number.isFinite(value) && value === 0);
      for (const btn of clearBtns) btn.style.display = shouldShow ? 'inline-flex' : 'none';
    }

    function clearAmount() {
      els.amount.value = '';
      compute();
      forceCursorToEnd({ force: true });
      updateClearButtonVisibility();
    }

    for (const btn of clearBtns) btn.addEventListener('click', clearAmount);

    // Direction swap
    function setDirection(dir) {
      state.direction = dir;
      const usdToVes = dir === 'usd-ves';

      els.swapLabel.textContent = usdToVes ? 'USD → VES' : 'VES → USD';

      compute();
    }

    let swapRotation = 0;
    els.swapBtn.addEventListener('click', () => {
      swapRotation += 180;
      els.swapIcon.style.transition = 'transform .45s cubic-bezier(.22, 1, .36, 1)';
      els.swapIcon.style.transform = `rotate(${swapRotation}deg)`;
      setDirection(state.direction === 'usd-ves' ? 'ves-usd' : 'usd-ves');
    });

    function forceCursorToEnd({ force = false } = {}) {
      const input = els.amount;
      const value = String(input.value ?? '');
      const end = value.length;

      if (typeof input.setSelectionRange === 'function') {
        requestAnimationFrame(() => {
          if (!force && document.activeElement !== input) return;
          input.focus();
          input.setSelectionRange(end, end);
        });
      } else if (typeof input.selectionStart === 'number' && typeof input.selectionEnd === 'number') {
        input.selectionStart = end;
        input.selectionEnd = end;
      }
    }

    const DEFAULT_AMOUNT = '1,00';

    els.amount.addEventListener('focus', () => {
      if (els.amount.value.trim() === DEFAULT_AMOUNT) {
        els.amount.value = '';
        compute();
        updateClearButtonVisibility();
      }
      forceCursorToEnd();
    });

    els.amount.addEventListener('blur', () => {
      if (els.amount.value.trim() !== '') return;
      els.amount.value = DEFAULT_AMOUNT;
      compute();
      updateClearButtonVisibility();
    });

    els.amount.addEventListener('click', forceCursorToEnd, { passive: true });

    const amountCard = document.getElementById('amount-card');
    amountCard?.addEventListener('click', (event) => {
      if (event.target.closest('button')) return;
      els.amount.focus();
    });
    els.amount.addEventListener('keyup', () => {
      forceCursorToEnd();
      updateClearButtonVisibility();
    });

    els.amount.addEventListener('keydown', (event) => {
      if (event.key !== '.' && event.key !== ',') return;
      event.preventDefault();
      insertDecimal();
    });

    els.amount.addEventListener('beforeinput', (event) => {
      if (event.inputType !== 'insertText' || event.data == null) return;
      if (event.data === '.' || event.data === ',') {
        event.preventDefault();
        insertDecimal();
        return;
      }
      if (!/^\d+$/.test(event.data)) event.preventDefault();
    });

    els.amount.addEventListener('input', () => {
      normalizeAmountField();
      compute();
      forceCursorToEnd();
      updateClearButtonVisibility();
    });

    updateClearButtonVisibility();

    const rateCards = Array.from(document.querySelectorAll('[data-rate-card]'));

    // Bauble interaction
    (() => {
      const layer = document.querySelector('.christmas-bg');
      const balls = Array.from(document.querySelectorAll('.ornament-ball'));
      if (!layer || !balls.length) return;

      const HIT_PAD = 10;
      let boxes = [];

      const measure = () => {
        boxes = balls.map((ball) => {
          const r = ball.getBoundingClientRect();
          return {
            orb: ball.closest('.ornament'),
            left: r.left - HIT_PAD, top: r.top - HIT_PAD,
            right: r.right + HIT_PAD, bottom: r.bottom + HIT_PAD,
          };
        });
      };

      const bounce = (orb) => {
        const impulse = orb && orb.querySelector('.bauble-impulse');
        if (!impulse) return;
        impulse.classList.remove('is-bouncing');
        void impulse.offsetWidth;
        impulse.classList.add('is-bouncing');
      };

      const orbAt = (x, y) => {
        for (const b of boxes) {
          if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) return b.orb;
        }
        return null;
      };

      window.addEventListener('pointerdown', (e) => {
        const direct = e.target.closest && e.target.closest('.ornament');
        bounce(direct || orbAt(e.clientX, e.clientY));
      }, { passive: true });

      window.addEventListener('resize', measure, { passive: true });
      window.addEventListener('orientationchange', measure, { passive: true });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

      layer.addEventListener('animationend', (e) => {
        if (e.animationName === 'smooth-nudge') e.target.classList.remove('is-bouncing');
      });

      measure();
    })();

    // Rate selection
    function selectRate(rateKey, { focusCard = false } = {}) {
      state.rate = rateKey;

      rateCards.forEach((card) => {
        const selected = card.dataset.rateCard === rateKey;
        card.classList.toggle('rate-selected', selected);
        card.setAttribute('aria-checked', String(selected));
        card.tabIndex = selected ? 0 : -1;
      });

      if (focusCard) {
        const active = rateCards.find((c) => c.dataset.rateCard === rateKey);
        if (active) active.focus();
      }
      compute();
    }

    rateCards.forEach((card) => {
      card.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate(8);
        selectRate(card.dataset.rateCard);
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          selectRate(card.dataset.rateCard);
          return;
        }
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (step) {
          e.preventDefault();
          const idx = rateCards.indexOf(card);
          const next = rateCards[(idx + step + rateCards.length) % rateCards.length];
          selectRate(next.dataset.rateCard, { focusCard: true });
        }
      });
    });

    const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_STANDALONE =
      window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    const banner = $('#install-banner');
    const bannerInner = $('#install-banner-inner');
    const installBtn = $('#install-btn');
    const installDismiss = $('#install-dismiss');
    let deferredPrompt = null;

    function rememberInstallBannerHidden() {
      localStorage.setItem('guiaInstalacionOculta', 'true');
    }

    function hideInstallBanner() {
      if (!banner || !bannerInner) return;
      bannerInner.classList.remove('translate-y-0', 'opacity-100');
      bannerInner.classList.add('translate-y-3', 'opacity-0');
      setTimeout(() => {
        banner.hidden = true;
        rememberInstallBannerHidden();
      }, 320);
    }

    function showBanner(iosMode = false) {
      const shouldHide = localStorage.getItem('guiaInstalacionOculta') === 'true';
      if (shouldHide) {
        banner.hidden = true;
        return;
      }

      banner.hidden = false;
      requestAnimationFrame(() => {
        bannerInner.classList.remove('translate-y-3', 'opacity-0');
        bannerInner.classList.add('translate-y-0', 'opacity-100');
      });

      if (iosMode) {
        $('#install-sub').innerHTML =
          'En iPhone: pulsa <b class="font-semibold text-white">Compartir</b> y luego «Añadir a la pantalla de inicio».';
        installBtn.textContent = 'Entendido';
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (!IS_STANDALONE) showBanner();
    });

    installBtn.addEventListener('click', async () => {
      hideInstallBanner();
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try {
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') hideInstallBanner();
      } catch (_) {}
      deferredPrompt = null;
    });

    installDismiss.addEventListener('click', () => hideInstallBanner());
    if (IS_IOS && !IS_STANDALONE) setTimeout(() => showBanner(true), 1200);

    async function fetchRates() {
      const pedirTexto = async (url, { ms = TIMEOUT_BRIDGE_MS, headers } = {}) => {
        const ac = new AbortController();
        const timer = setTimeout(() => ac.abort(), ms);
        try {
          const res = await fetch(url, { headers, signal: ac.signal, cache: 'no-store' });
          if (!res.ok) {
            let cuerpo = '';
            try { cuerpo = (await res.text()).slice(0, 180).replace(/\s+/g, ' '); } catch (_) {}
            const err = new Error(`${url} → HTTP ${res.status} ${res.statusText}${cuerpo ? ` · cuerpo: ${cuerpo}` : ''}`);
            err.status = res.status;
            throw err;
          }
          return res.text();
        } catch (err) {
          if (err && err.name === 'AbortError') {
            console.error(`[tasasve] Timeout de red (${ms / 1000} s) en ${url}`);
          }
          throw err;
        } finally {
          clearTimeout(timer);
        }
      };

      const pedirJSON = async (url) => {
        const text = await pedirTexto(url, { ms: TIMEOUT_PROXY_MS, headers: { Accept: 'application/json' } });
        try {
          return JSON.parse(text);
        } catch (_) {
          const err = new Error(`${url} → la respuesta no es JSON válido (primeros bytes: ${text.slice(0, 60).replace(/\s+/g, ' ') || '(vacío)'})`);
          err.status = 200;
          throw err;
        }
      };

      const diagnostica = (label, err) => {
        const status = err && err.status;
        let pista = '';
        if (status === 401 || status === 403) {
          pista = 'API key ausente o inválida (header X-API-Key). Verifica COTIZAVE_API_KEY.';
        } else if (status === 500 && /missing_api_key/.test(String(err.message))) {
          pista = 'Falta la variable COTIZAVE_API_KEY en el hosting (Netlify → Site settings → Environment variables) y redeployar.';
        } else if (err instanceof TypeError) {
          pista = 'Posible bloqueo CORS, red caída o mixed-content: verifica que la URL use https:// en producción.';
        }
        console.error(`[tasasve] Fuente "${label}" falló:`, err && err.message ? err.message : err, pista ? `→ ${pista}` : '');
      };

      const fuentesFallidas = [];

      for (const { label, url } of PROXY_SOURCES) {
        try {
          return await pedirJSON(url);
        } catch (err) {
          fuentesFallidas.push(label);
          diagnostica(label, err);
        }
      }

      const [bcvRes, cotizaveRes] = await Promise.allSettled([
        pedirTexto(BRIDGE_BCV),
        pedirTexto(BRIDGE_COTIZAVE),
      ]);

      const fusion = {};
      const tomar = (resultado, parser, label, soloMercados) => {
        if (resultado.status !== 'fulfilled') {
          diagnostica(label, resultado.reason);
          fuentesFallidas.push(label);
          return;
        }
        const parsed = parser(resultado.value);
        if (!parsed) {
          console.error(`[tasasve] ${label} respondió pero el parseo falló (formato cambiado).`);
          fuentesFallidas.push(label);
          return;
        }
        console.info(`[tasasve] Datos obtenidos desde ${label}.`);
        for (const rate of parsed.rates) {
          if (soloMercados && !soloMercados.includes(rate.market)) continue;
          if (!fusion[rate.market]) fusion[rate.market] = rate;
        }
      };

      tomar(bcvRes, parseBcvOfficial, 'bcv.org.ve');
      tomar(cotizaveRes, parseBridgeRates, 'cotizave.com', ['binance_p2p', 'bcv']);

      const rates = Object.values(fusion);
      if (rates.length) return { rates };

      const resumen = new Error(`Ninguna fuente de tasas respondió (${fuentesFallidas.join(' → ')}).`);
      diagnostica('resumen', resumen);
      throw resumen;
    }

    function parseBcvOfficial(text) {
      const num = (s) => parseFloat(String(s).replace(/\./g, '').replace(',', '.'));
      const rates = [];

      const monedas = [
        { market: 'eur_reference', code: 'EUR' },
        { market: 'reference', code: 'USD' },
      ];

      for (const { market, code } of monedas) {
        const re = new RegExp(`${code}\\s*\\n*\\s*\\*\\*([\\d.,]+)\\*\\*`);
        const m = text.match(re);
        if (m && Number.isFinite(num(m[1]))) {
          rates.push({ market, mid: num(m[1]), updated_at: new Date().toISOString(), source: 'bcv.org.ve' });
        }
      }
      return rates.length ? { rates } : null;
    }

    function parseBridgeRates(text) {
      const num = (s) => parseFloat(s.replace(/\./g, '').replace(',', '.'));
      const rates = [];

      const bcv = text.match(/BCV\s+BCV oficial[^\n]*?Bs\.\s*([\d.,]+)/);
      if (bcv) {
        rates.push({ market: 'bcv', mid: num(bcv[1]), updated_at: new Date().toISOString() });
      }

      const bin = text.match(/BN\s+Binance P2P[^\n]*?Bs\.\s*([\d.,]+)/);
      if (bin) {
        rates.push({ market: 'binance_p2p', mid: num(bin[1]), updated_at: new Date().toISOString() });
      }

      return rates.length ? { rates } : null;
    }

    let lastDetailError = null;

    function setConnectionError(message) {
      lastDetailError = message;
      els.resultDetail.textContent = message;
    }

    function clearConnectionError() {
      lastDetailError = null;
    }

    function applyRates(payload) {
      let applied = 0;
      try {
        const list = Array.isArray(payload && payload.rates) ? payload.rates : [];
        const byMarket = {};
        for (const r of list) {
          if (r && typeof r === 'object') byMarket[String(r.market || '').toLowerCase()] = r;
        }
        const pick = (...keys) => keys.map((k) => byMarket[k]).find((r) => r && Number.isFinite(r.mid));

        const eur =
          list.find((rate) => rate && rate.market === 'eur_reference') ||
          list.find((rate) => rate && rate.base === 'EUR');
        const euroRate = Number(eur?.mid) || 0;

        const encontradas = {
          bcv: pick('reference', 'bcv', 'bcv_oficial'),
          binance: pick('binance_p2p', 'binance'),
          euro: euroRate > 0 ? { mid: euroRate, ...eur } : null,
        };

        for (const [key, rate] of Object.entries(encontradas)) {
          if (!rate) continue;
          RATES[key].value = rate.mid;
          applied += 1;
        }
        updateRatePrices();
      } catch (err) {
        console.error('[tasasve] Error procesando las tasas (payload inesperado):', err);
      } finally {
        ratesArrived = true;
        clearConnectionError();
        if (applied) writeRatesCache();
        if (RATES.euro.value == null) {
          console.warn('[tasasve] El payload recibido NO incluyó la tasa del Euro (market "eur_reference" / base "EUR").');
        }
        compute();
      }
    }

    function stopLoading() {
      if (lastDetailError) {
        els.resultDetail.textContent = lastDetailError;
        return;
      }

      const hasData = RATES.bcv.value != null || RATES.binance.value != null || RATES.euro.value != null;
      if (hasData) {
        compute();
      } else {
        els.resultDetail.textContent = 'Sin conexión con la API';
      }
    }

    const hasAnyRate = () => RATE_COLUMNS.some((c) => Number.isFinite(RATES[c.id].value));

    let inFlight = null;
    let lastAttempt = 0;

    async function loadRates({ force = false } = {}) {
      if (!force && isCacheFresh()) return;
      if (inFlight) return inFlight;
      if (!force && Date.now() - lastAttempt < 30 * 1000) return;
      lastAttempt = Date.now();

      inFlight = (async () => {
        try {
          const payload = await fetchRates();
          applyRates(payload);
        } catch (err) {
          console.error('[tasasve] No se pudieron obtener las tasas:', err);
          if (!hasAnyRate()) setConnectionError('Sin conexión con la API');
        } finally {
          stopLoading();
        }
      })().finally(() => { inFlight = null; });

      return inFlight;
    }

    selectRate(state.rate || 'bcv');
    loadRates();
    setInterval(loadRates, REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadRates();
    });

    window.__tasasVE = { applyRates, loadRates, stopLoading, selectRate, fetchRates, RATES, readRatesCache };
  })();
  </script>
